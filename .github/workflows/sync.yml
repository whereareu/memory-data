name: Sync Articles from Memory

on:
  # 每小时运行一次
  schedule:
    - cron: '0 * * * *'

  # 允许手动触发
  workflow_dispatch:

  # 当 memory 仓库的 workflow 完成后触发
  workflow_run:
    workflows: ["Update Articles"]
    types:
      - completed

jobs:
  sync-articles:
    runs-on: ubuntu-latest

    # 只在 source workflow 成功时运行
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout memory repo
        uses: actions/checkout@v4
        with:
          repository: whereareu/memory
          path: memory

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd memory/crawler
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil pydantic

      - name: Run crawler
        run: |
          cd memory/crawler/src
          python main.py

      - name: Copy articles.json
        run: |
          cp memory/crawler/data/articles.json articles.json

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add articles.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 更新文章数据 $(date '+%Y-%m-%d %H:%M:%S')"
          git push